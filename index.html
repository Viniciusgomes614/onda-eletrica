  input[type="checkbox"] { width: auto; margin-right: 8px; transform: scale(1.2); }
  .btn { width: 100%; padding: 14px 16px; border-radius: 12px; border: none; background: var(--surface-2); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: var(--accent); color: #1A1300; }
  .btn-danger { background: var(--warn); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; background: var(--modal-bg); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn .2s ease; }

  .toast-in { animation: toastIn .4s cubic-bezier(.2,.9,.3,1) both; }

const DOMINIO_PERMITIDO = "@ufba.br"; // Trava de Segurança

const META_COLAB_SEMANA = 8 * 3600;
const META_EFETIVO_MES = 64 * 3600;
const META_COLAB_MES = 32 * 3600;

// --- UTILIDADES ---
const fmtHMS = (s) => { const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=Math.floor(s%60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`; };
const fmtHM = (s) => `${Math.floor(s/3600)}h${String(Math.floor((s%3600)/60)).padStart(2,'0')}`;
const startOfWeek = (d) => { const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x; };
const startOfMonth = (d) => { const x=new Date(d.getFullYear(), d.getMonth(), 1); x.setHours(0,0,0,0); return x; };

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const size = Math.min(img.width, img.height, 400); 
      canvas.width = size; canvas.height = size;
      canvas.getContext("2d").drawImage(img, (img.width-size)/2, (img.height-size)/2, size, size, 0, 0, size, size);
      callback(canvas.toDataURL("image/jpeg", 0.6)); 
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

const Avatar = ({ user, size="md" }) => {
  const cls = size==="lg" ? "avatar avatar-lg" : "avatar";
  if(user?.photoBase64) return <img src={user.photoBase64} className={cls} />;
  return <div className={cls}>{user?.name?.charAt(0).toUpperCase() || "?"}</div>;
};

// --- COMPONENTES ---
function Modal({ title, onClose, children }) {
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
          <h3 style={{margin:0, fontSize:18}}>{title}</h3>
          <button onClick={onClose} style={{background:"none", border:"none", color:"var(--text)", fontSize:20, cursor:"pointer"}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function LoginGoogleScreen({ onLogin, busy }) {
  return (
    <div className="fade-in" style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:32, textAlign:"center"}}>
      <div style={{width:64, height:64, borderRadius:16, background:"var(--accent-soft)", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:24}}>
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M2 12h4l2-7 4 14 2-7h10" stroke="#F2B705" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>

      <h1 style={{fontSize:32, margin:"0 0 12px"}}>Onda Elétrica</h1>

      <button className="btn" onClick={onLogin} disabled={busy} style={{background:"#fff", color:"#333", border:"1px solid #ddd", fontSize:16, padding:"16px"}}><Icons.Google /> {busy ? "Verificando..." : "Entrar com o Google"}</button>
    </div>

// ATUALIZADO: Suporte para editar dados existentes e botão de cancelar
function OnboardingScreen({ fbUser, dbUser, onSave, onCancel, busy }) {
  const [name, setName] = useState(dbUser?.name || fbUser?.displayName || "");
  const [role, setRole] = useState(dbUser?.role || "Membro Efetivo");
  const [myGestoes, setMyGestoes] = useState(dbUser?.gestoes || []);
  const [photoBase64, setPhotoBase64] = useState(dbUser?.photoBase64 || fbUser?.photoURL || null);

  const toggleGestao = (g) => setMyGestoes(p => p.includes(g) ? p.filter(x=>x!==g) : [...p, g]);
  const handleFile = (e) => { if(e.target.files[0]) compressImage(e.target.files[0], setPhotoBase64); };

  const submit = () => {
    if(!name.trim()) return alert("Digite seu nome!");
    onSave({ name: name.trim(), role, gestoes: myGestoes, photoBase64 });
  };

  return (
    <div className="fade-in" style={{flex:1, padding:"32px 24px", overflowY:"auto"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8}}>
        <h1 style={{fontSize:28, margin:0}}>{dbUser ? "Editar Perfil" : <>Quase lá,<br/><span style={{color:"var(--accent)"}}>{name.split(" ")[0] || "Equipe"}!</span></>}</h1>
        {onCancel && <button onClick={onCancel} style={{background:"none", border:"none", color:"var(--text)", fontSize:24, cursor:"pointer"}}>×</button>}
      </div>
      <p style={{color:"var(--text-muted)", marginBottom:24}}>{dbUser ? "Atualize seu vínculo, gestões e foto abaixo." : "Configure os últimos detalhes do seu perfil."}</p>
      
      <div style={{display:"flex", alignItems:"center", gap:16, marginBottom:20}}>
        <Avatar user={{photoBase64, name}} size="lg" />
        <div><label style={{fontSize:14, color:"var(--accent)", cursor:"pointer", fontWeight:600}}>+ Trocar foto<input type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/></label></div>
      </div>
      <label style={{fontSize:13, color:"var(--text-muted)", marginBottom:6, display:"block"}}>Seu Nome</label>
      <input value={name} onChange={e=>setName(e.target.value)} placeholder="Nome completo" />
      <label style={{fontSize:13, color:"var(--text-muted)", marginBottom:6, display:"block", marginTop:12}}>Vínculo</label>
      <select value={role} onChange={e=>setRole(e.target.value)}><option>Membro Efetivo</option><option>Colaborador</option></select>
      <label style={{fontSize:13, color:"var(--text-muted)", marginBottom:6, display:"block", marginTop:12}}>Suas Gestões (pode escolher várias)</label>
      <div style={{background:"var(--surface)", padding:12, borderRadius:12, border:"1px solid var(--line)", marginBottom:24}}>
        {GESTOES.map(g => (
          <label key={g} style={{display:"flex", alignItems:"center", marginBottom:10, fontSize:14, cursor:"pointer"}}>
            <input type="checkbox" checked={myGestoes.includes(g)} onChange={()=>toggleGestao(g)} />{g}
          </label>
        ))}
      </div>
      <button className="btn btn-primary" onClick={submit} disabled={busy || !name.trim()}>{busy ? "Salvando..." : (dbUser ? "Salvar Perfil" : "Entrar no App")}</button>
    </div>
  );
}

function PontoTab({ user, users, activeSession, activeGroupCount, elapsed, onStart, onStop, onManualAdd, onDeleteSession, sessions, busy }) {
  const running = !!activeSession;
  const [showGroupModal, setShowGroupModal] = useState(false);
  const [showManualModal, setShowManualModal] = useState(false);
  const [showStopModal, setShowStopModal] = useState(false);
  
  const [selectedGroup, setSelectedGroup] = useState([]);
  const [mStart, setMStart] = useState("");
  const [mEnd, setMEnd] = useState("");

  const myTodaySecs = useMemo(() => {
    const today = startOfWeek(new Date()); today.setHours(0,0,0,0);
    return sessions.filter(s => s.uid === user.uid && s.endTime && new Date(s.startTime) >= new Date(new Date().setHours(0,0,0,0))).reduce((a,b)=>a+b.durationSeconds, 0);
  }, [sessions, user]);

  const recentSessions = useMemo(() => sessions.filter(s => s.uid === user.uid && s.endTime).slice(0,5), [sessions, user]);

  const handleStartGroup = () => { onStart(selectedGroup); setShowGroupModal(false); };
  
  const handleStopClick = () => {
    if (activeGroupCount > 0) setShowStopModal(true);
    else onStop(false);
  };

  const handleSaveManual = () => {
    if(!mStart || !mEnd) return alert("Preencha as datas.");
    const sTime = new Date(mStart).getTime(); const eTime = new Date(mEnd).getTime();
    if(eTime <= sTime) return alert("Fim deve ser maior que Início.");
    onManualAdd(new Date(sTime).toISOString(), new Date(eTime).toISOString(), Math.floor((eTime-sTime)/1000));
    setShowManualModal(false);
  };
  const askDelete = (id) => { if(window.confirm("Deseja apagar essa sessão?")) onDeleteSession(id); };

  return (
    <div className="fade-in" style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", padding:"24px 20px", overflowY:"auto"}}>
      <div style={{position:"relative", display:"flex", justifyContent:"center", alignItems:"center", margin:"20px 0 40px"}}>
        <button disabled={busy} onClick={running ? handleStopClick : () => onStart([])} style={{ width:200, height:200, borderRadius:"50%", border:"none", cursor:"pointer", background: running ? "radial-gradient(circle at 30% 30%, #ff7a4d, var(--warn))" : "radial-gradient(circle at 30% 30%, #ffd35c, var(--accent))", color: running ? "white" : "#1A1300", boxShadow: running ? "0 0 0 12px rgba(228,87,46,0.15)" : "0 0 0 12px rgba(242,183,5,0.15)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", transition:"all .3s" }}>
          <div className="mono" style={{fontSize:42, fontWeight:700, letterSpacing:1}}>{fmtHMS(elapsed)}</div>
          <div style={{fontSize:14, fontWeight:600, opacity:0.8, marginTop:4}}>{running ? "PARAR" : "INICIAR"}</div>
          {running && activeGroupCount > 0 && <div style={{fontSize:12, opacity:0.9, marginTop:8}}>Você + {activeGroupCount} pessoa(s)</div>}
        </button>
      </div>

      {!running && (
        <div style={{display:"flex", gap:10, width:"100%", marginBottom:30}}>
          <button className="btn" onClick={()=>setShowGroupModal(true)} style={{flex:1, fontSize:13}}><Icons.Users/> Iniciar Grupo</button>
          <button className="btn" onClick={()=>setShowManualModal(true)} style={{flex:1, fontSize:13}}><Icons.Clock/> Esqueci de Bater</button>
        </div>
      )}

      <div style={{width:"100%"}}>
        <div style={{fontSize:13, color:"var(--text-muted)", marginBottom:10}}>Hoje: <span className="mono" style={{color:"var(--text)", fontWeight:600}}>{fmtHM(myTodaySecs + (running?elapsed:0))}</span></div>
        {recentSessions.length === 0 && <div style={{fontSize:13, color:"var(--text-muted)"}}>Nenhum registro recente.</div>}
        {recentSessions.map(s => {
          const dt = new Date(s.startTime);
          return (
            <div key={s.id} style={{display:"flex", justifyContent:"space-between", alignItems:"center", background:"var(--surface)", padding:"12px 14px", borderRadius:12, marginBottom:8, border:"1px solid var(--line)"}}>
              <div>
                <div style={{fontSize:14, fontWeight:500}}>{dt.toLocaleDateString("pt-BR")}</div>
                <div style={{fontSize:12, color:"var(--text-muted)"}}>{dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} — {fmtHM(s.durationSeconds)}</div>
              </div>
              <button onClick={()=>askDelete(s.id)} style={{background:"none", border:"none", color:"var(--warn)", cursor:"pointer", padding:8}}><Icons.Trash/></button>
            </div>
          );
        })}
      </div>

      {showGroupModal && (
        <Modal title="Trabalho em Grupo" onClose={()=>setShowGroupModal(false)}>
          <p style={{fontSize:13, color:"var(--text-muted)", marginBottom:16}}>Selecione quem está trabalhando com você agora.</p>
          <div style={{maxHeight:250, overflowY:"auto", marginBottom:16, border:"1px solid var(--line)", borderRadius:12, padding:10}}>
            {users.filter(u=>u.uid !== user.uid).map(u => (
              <label key={u.uid} style={{display:"flex", alignItems:"center", padding:"8px 0", cursor:"pointer", borderBottom:"1px solid var(--line)"}}>
                <input type="checkbox" checked={selectedGroup.includes(u.uid)} onChange={(e)=>{ if(e.target.checked) setSelectedGroup([...selectedGroup, u.uid]); else setSelectedGroup(selectedGroup.filter(x=>x!==u.uid)); }}/>
                <Avatar user={u} /><span style={{marginLeft:10, fontSize:14}}>{u.name}</span>
              </label>
            ))}
          </div>
          <button className="btn btn-primary" onClick={handleStartGroup} disabled={selectedGroup.length===0}>Iniciar para {selectedGroup.length+1} pessoas</button>
        </Modal>
      )}

      {showStopModal && (
        <Modal title="Parar Cronômetro" onClose={()=>setShowStopModal(false)}>
          <p style={{fontSize:14, color:"var(--text-muted)", marginBottom:20, lineHeight:1.5}}>Você está em um ponto de grupo. Deseja encerrar o ponto de todas as pessoas vinculadas a essa sessão ou apenas o seu?</p>
          <div style={{display:"flex", flexDirection:"column", gap:10}}>
            <button className="btn btn-primary" onClick={() => { onStop(true); setShowStopModal(false); }}>Parar para TODOS</button>
            <button className="btn" style={{background:"var(--surface)", border:"1px solid var(--line)"}} onClick={() => { onStop(false); setShowStopModal(false); }}>Parar SÓ PARA MIM</button>
          </div>
        </Modal>
      )}

      {showManualModal && (
        <Modal title="Adicionar Registro Antigo" onClose={()=>setShowManualModal(false)}>
          <label style={{fontSize:13, display:"block", marginBottom:4}}>Início do trabalho</label>
          <input type="datetime-local" value={mStart} onChange={e=>setMStart(e.target.value)} />
          <label style={{fontSize:13, display:"block", marginBottom:4, marginTop:10}}>Fim do trabalho</label>
          <input type="datetime-local" value={mEnd} onChange={e=>setMEnd(e.target.value)} />
          <button className="btn btn-primary" style={{marginTop:16}} onClick={handleSaveManual}>Salvar Horas</button>
        </Modal>
      )}
    </div>
  );
}

function MuralTab({events}) {
  return (
    <div className="fade-in" style={{flex:1, padding:"20px", overflowY:"auto"}}>
      <h2 style={{fontSize:20, marginTop:0, marginBottom:16}}>Mural da Equipe</h2>
      {events.length === 0 ? <p style={{color:"var(--text-muted)", fontSize:14}}>Silêncio por aqui...</p> : null}
      <div style={{display:"flex", flexDirection:"column", gap:10}}>
        {events.map(ev => {
          const displayName = ev.names || ev.name || "Alguém";
          const isPlural = displayName.includes(",");

          return (
            <div key={ev.id} style={{display:"flex", gap:12, background:"var(--surface)", border:"1px solid var(--line)", borderRadius:12, padding:"14px"}}>
              <div style={{width:10, height:10, borderRadius:"50%", marginTop:5, flexShrink:0, background: ev.type==="start" ? "var(--live)" : "var(--warn)"}}/>
              <div>
                <div style={{fontSize:14.5, lineHeight:1.4}}>
                  <strong>{displayName}</strong> {ev.type === "start" ? (isPlural?"começaram a trabalhar":"começou a trabalhar") : (isPlural?"pararam o ponto":"parou o ponto")}
                  {ev.type === "stop" && ev.durationSeconds ? ` (${fmtHM(ev.durationSeconds)})` : ""}
                </div>
                <div className="mono" style={{fontSize:11.5, color:"var(--text-muted)", marginTop:4}}>{ev.timeLabel}</div>
              </div>
            </div>
          )
        })}
      </div>
    </div>
  );
}

function RankingTab({sessions, users, user, activeSession, elapsed}) {
  const [period, setPeriod] = useState("semana");
  
  const range = useMemo(()=>{
    const now = new Date();
    if(period === "semana") return { start: startOfWeek(now) };
    if(period === "mes") return { start: startOfMonth(now) };
    return { start: new Date(2000,0,1) };
  }, [period]);

  const totals = useMemo(()=>{
    const map = {};
    users.forEach(u => map[u.uid] = { name: u.name, role: u.role, photo: u.photoBase64, seconds: 0 });
    for(const s of sessions){
      if(!s.endTime || new Date(s.startTime) < range.start) continue;
      if(map[s.uid]) map[s.uid].seconds += s.durationSeconds;
    }
    if(activeSession && map[user.uid]) map[user.uid].seconds += elapsed;
    return Object.entries(map).map(([uid, v]) => ({ uid, ...v })).sort((a,b) => b.seconds - a.seconds);
  }, [sessions, range, users, activeSession, elapsed, user]);

  const getPill = (k, label) => (
    <button onClick={()=>setPeriod(k)} style={{ padding:"8px 14px", borderRadius:20, fontSize:13, border:"1px solid var(--line)", cursor:"pointer", background: period===k ? "var(--accent)" : "var(--surface)", color: period===k ? "#1A1300" : "var(--text-muted)", fontWeight: period===k ? 600 : 500 }}>{label}</button>
  );

  return (
    <div className="fade-in" style={{flex:1, padding:"20px", overflowY:"auto"}}>
      <div style={{display:"flex", gap:8, marginBottom:20}}>
        {getPill("semana", "Semana")} {getPill("mes", "Mês")} {getPill("tudo", "Tudo")}
      </div>
      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {totals.map((t, i) => {
          const isEfetivo = t.role === "Membro Efetivo";
          const goal = period==="semana" ? (isEfetivo?META_EFETIVO_SEMANA:META_COLAB_SEMANA) : (period==="mes" ? (isEfetivo?META_EFETIVO_MES:META_COLAB_MES) : null);
          const progress = goal ? Math.min(100, (t.seconds/goal)*100) : 0;
          return (
            <div key={t.uid} style={{display:"flex", alignItems:"center", gap:12, background: t.uid===user.uid ? "var(--accent-soft)" : "var(--surface)", border:"1px solid var(--line)", borderRadius:12, padding:"12px"}}>
              <div className="mono" style={{width:20, textAlign:"center", color:"var(--text-muted)", fontSize:12, fontWeight:i<3?700:400}}>{i+1}</div>
              <Avatar user={{photoBase64:t.photo, name:t.name}} size="sm" />
              <div style={{flex:1, overflow:"hidden"}}>
                <div style={{fontSize:14, fontWeight:500, whiteSpace:"nowrap", textOverflow:"ellipsis", overflow:"hidden"}}>{t.name}</div>
                {goal && (
                  <div style={{height:4, background:"var(--surface-2)", borderRadius:2, marginTop:6, overflow:"hidden"}}>
                    <div style={{height:"100%", width:`${progress}%`, background: progress>=100 ? "var(--live)" : "var(--accent)"}}/>
                  </div>
                )}
              </div>
              <div className="mono" style={{fontSize:14, fontWeight:600}}>{fmtHM(t.seconds)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ChatTab({user, chatMsgs, onSend}) {
  const [text, setText] = useState("");
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMsgs]);

  const send = (e) => { e.preventDefault(); if(!text.trim()) return; onSend(text.trim()); setText(""); };

  return (
    <div className="fade-in" style={{flex:1, display:"flex", flexDirection:"column", overflow:"hidden", background:"var(--surface)"}}>
      <div style={{flex:1, overflowY:"auto", padding:"20px", display:"flex", flexDirection:"column", gap:12}}>
        {chatMsgs.slice().reverse().map(m => {
          const isMe = m.uid === user.uid;
          return (
            <div key={m.id} style={{display:"flex", gap:8, flexDirection: isMe?"row-reverse":"row", alignItems:"flex-end"}}>
              {!isMe && <Avatar user={{name:m.name, photoBase64:m.photo}} />}
              <div style={{display:"flex", flexDirection:"column", alignItems: isMe?"flex-end":"flex-start", maxWidth:"80%"}}>
                {!isMe && <span style={{fontSize:11, color:"var(--text-muted)", marginBottom:4, marginLeft:4}}>{m.name}</span>}
                <div className={isMe ? "chat-bubble chat-mine" : "chat-bubble chat-other"}>{m.text}</div>
              </div>
            </div>
          );
        })}
        <div ref={endRef} />
      </div>
      <form onSubmit={send} style={{padding:"12px 16px", background:"var(--bg)", borderTop:"1px solid var(--line)", display:"flex", gap:10, paddingBottom:"calc(12px + env(safe-area-inset-bottom))"}}>
        <input value={text} onChange={e=>setText(e.target.value)} placeholder="Mensagem..." style={{margin:0, flex:1, borderRadius:20}} />
        <button type="submit" style={{width:46, height:46, borderRadius:"50%", border:"none", background:"var(--accent)", color:"#1A1300", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0}}><Icons.Send/></button>
      </form>
    </div>
  );
}

function MembrosTab({users, me, onRemoveUser}) {
  const [modalUser, setModalUser] = useState(null);
  const [keyword, setKeyword] = useState("");

  const efetivos = users.filter(u => u.role === "Membro Efetivo");
  const colaboradores = users.filter(u => u.role !== "Membro Efetivo");
  const quorum = Math.ceil(efetivos.length / 2);

  const remove = () => {
    if(keyword !== "REMOVER") return alert("Palavra-chave incorreta.");
    onRemoveUser(modalUser.uid); setModalUser(null); setKeyword("");
  };

  const UserRow = ({u}) => (
    <div onClick={()=>setModalUser(u)} style={{display:"flex", alignItems:"center", gap:12, padding:"12px 0", borderBottom:"1px solid var(--line)", cursor:"pointer"}}>
      <Avatar user={u} />
      <div><div style={{fontSize:15, fontWeight:500}}>{u.name} {u.uid===me.uid?"(Você)":""}</div><div style={{fontSize:12, color:"var(--text-muted)", marginTop:2}}>{u.role}</div></div>
    </div>
  );

  return (
    <div className="fade-in" style={{flex:1, padding:"20px", overflowY:"auto"}}>
      <div style={{background:"var(--accent-soft)", padding:"12px 16px", borderRadius:12, marginBottom:24, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <span style={{fontSize:14, fontWeight:600}}>Quórum Mínimo:</span><span className="mono" style={{fontSize:20, fontWeight:700, color:"var(--accent)"}}>{quorum}</span>
      </div>
      <h3 style={{fontSize:14, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1}}>Membros Efetivos ({efetivos.length})</h3>
      <div style={{marginBottom:24}}>{efetivos.map(u => <UserRow key={u.uid} u={u} />)}</div>
      <h3 style={{fontSize:14, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:1}}>Colaboradores ({colaboradores.length})</h3>
      <div>{colaboradores.map(u => <UserRow key={u.uid} u={u} />)}</div>

      {modalUser && (
        <Modal title="Perfil" onClose={()=>setModalUser(null)}>
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", marginBottom:20}}>
            <Avatar user={modalUser} size="lg" /><h2 style={{margin:"12px 0 4px", fontSize:20}}>{modalUser.name}</h2>
            <div style={{color:"var(--accent)", fontSize:14, fontWeight:500}}>{modalUser.role}</div>
          </div>
          <div style={{background:"var(--surface-2)", borderRadius:12, padding:16, marginBottom:24}}>
            <h4 style={{margin:"0 0 10px", fontSize:13, color:"var(--text-muted)"}}>GESTÕES</h4>
            {modalUser.gestoes?.length > 0 ? <ul style={{margin:0, paddingLeft:16, fontSize:14}}>{modalUser.gestoes.map(g => <li key={g} style={{marginBottom:4}}>{g}</li>)}</ul> : <span style={{fontSize:14, opacity:0.6}}>Nenhuma gestão</span>}
          </div>
          <div style={{borderTop:"1px solid var(--warn)", paddingTop:16, marginTop:16}}>
            <p style={{fontSize:13, color:"var(--warn)", margin:"0 0 10px"}}>Deseja apagar esta pessoa? Digite <strong>REMOVER</strong> abaixo:</p>
            <input value={keyword} onChange={e=>setKeyword(e.target.value.toUpperCase())} placeholder="REMOVER" style={{borderColor:"var(--warn)"}}/>
            <button className="btn btn-danger" onClick={remove}>Excluir Membro</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function App() {
  const [fbReady, setFbReady] = useState(!!window.fb);
  const [user, setUser] = useState(null); 
  const [dbUser, setDbUser] = useState(null); 
  
  // Controle de edição de perfil
  const [isEditingProfile, setIsEditingProfile] = useState(false);

  const [theme, setTheme] = useState(localStorage.getItem("onda-theme") || "dark");
  useEffect(() => { document.body.className = theme === "light" ? "theme-light" : ""; localStorage.setItem("onda-theme", theme); }, [theme]);

  const [tab, setTab] = useState("ponto");
  const [busy, setBusy] = useState(false);
  const [loginBusy, setLoginBusy] = useState(false);
  
  const [users, setUsers] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [events, setEvents] = useState([]);
  const [chatMsgs, setChatMsgs] = useState([]);
  
  const [activeSession, setActiveSession] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [goalShown, setGoalShown] = useState({ week: false, month: false });

  useEffect(() => {
    const h = () => setFbReady(true); window.addEventListener("fb-ready", h);
    if(window.fb) setFbReady(true);
    return () => window.removeEventListener("fb-ready", h);
  }, []);

  useEffect(() => {
    if(!fbReady) return;
    const unsub = window.fb.onAuthStateChanged(window.fb.auth, async (fbUser) => {
      if(fbUser) {
        if (DOMINIO_PERMITIDO && !fbUser.email.endsWith(DOMINIO_PERMITIDO)) {
            await window.fb.signOut(window.fb.auth); setUser(null); setDbUser(null); return;
        }
        setUser(fbUser);
        const docSnap = await window.fb.getDoc(window.fb.doc(window.fb.db, "members", fbUser.uid));
        if(docSnap.exists()) setDbUser(docSnap.data()); else setDbUser(null);
      } else { setUser(null); setDbUser(null); }
    });
    return () => unsub();
  }, [fbReady]);

  const handleGoogleLogin = async () => {
    setLoginBusy(true);
    try {
      const provider = new window.fb.GoogleAuthProvider();
      if(DOMINIO_PERMITIDO) provider.setCustomParameters({ hd: DOMINIO_PERMITIDO.replace('@', '') }); 
      const cred = await window.fb.signInWithPopup(window.fb.auth, provider);
      if (DOMINIO_PERMITIDO && !cred.user.email.endsWith(DOMINIO_PERMITIDO)) {
         await window.fb.signOut(window.fb.auth);
         alert(`Acesso restrito!\nVocê deve usar um e-mail com o domínio ${DOMINIO_PERMITIDO} para entrar.`);
      }
    } catch(e) { if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') alert("Erro ao entrar: " + e.message); } 
    finally { setLoginBusy(false); }
  };

  const handleLogout = async () => await window.fb.signOut(window.fb.auth);

  useEffect(() => {
    if(!fbReady || !user || !dbUser) return;
    const { db, collection, query, onSnapshot, orderBy, limit } = window.fb;
    
    const unsubU = onSnapshot(collection(db, "members"), s => setUsers(s.docs.map(d=>({uid:d.id, ...d.data()}))));
    const unsubS = onSnapshot(query(collection(db, "sessions"), orderBy("startTime", "desc"), limit(2000)), s => {
      const all = s.docs.map(d=>({id:d.id, ...d.data()})); setSessions(all);
      setActiveSession(all.find(x => x.uid === user.uid && x.endTime === null) || null);
    });
    const unsubE = onSnapshot(query(collection(db, "events"), orderBy("createdAt", "desc"), limit(40)), s => {
      setEvents(s.docs.map(d=>{ const data=d.data(); return {id:d.id, ...data, timeLabel: data.createdAt?.toDate().toLocaleString("pt-BR",{hour:"2-digit",minute:"2-digit"})||""} }));
    });
    const unsubC = onSnapshot(query(collection(db, "chat"), orderBy("createdAt", "desc"), limit(40)), s => {
      setChatMsgs(s.docs.map(d=>({id:d.id, ...d.data()})));
    });

    return () => { unsubU(); unsubS(); unsubE(); unsubC(); };
  }, [fbReady, user, dbUser]);

  useEffect(() => {
    if(!activeSession) { setElapsed(0); return; }
    const id = setInterval(() => setElapsed(Math.floor((Date.now() - new Date(activeSession.startTime).getTime())/1000)), 1000);
    return () => clearInterval(id);
  }, [activeSession]);

  useEffect(() => {
    if(!activeSession || !dbUser) return;
    const isEfetivo = dbUser.role === "Membro Efetivo";
    const gW = isEfetivo ? META_EFETIVO_SEMANA : META_COLAB_SEMANA;
    const gM = isEfetivo ? META_EFETIVO_MES : META_COLAB_MES;
    const wkSum = sessions.filter(s => s.uid === user.uid && s.endTime && new Date(s.startTime) >= startOfWeek(new Date())).reduce((a,b)=>a+b.durationSeconds, 0);
    const moSum = sessions.filter(s => s.uid === user.uid && s.endTime && new Date(s.startTime) >= startOfMonth(new Date())).reduce((a,b)=>a+b.durationSeconds, 0);

    if (wkSum + elapsed === gW && !goalShown.week) { alert("🎉 META SEMANAL ATINGIDA! Bom trabalho!"); setGoalShown(p=>({...p, week:true})); }
    if (moSum + elapsed === gM && !goalShown.month) { alert("🏆 META MENSAL ATINGIDA! Você é incrível!"); setGoalShown(p=>({...p, month:true})); }
  }, [elapsed, sessions, activeSession, dbUser, goalShown, user]);

  const saveProfile = async (profileData) => {
    setBusy(true);
    await window.fb.setDoc(window.fb.doc(window.fb.db, "members", user.uid), { ...profileData, email: user.email, updatedAt: new Date().toISOString() }, {merge:true});
    setDbUser(profileData); 
    setIsEditingProfile(false); // Fecha o modo de edição se estiver aberto
    setBusy(false);
  };

  const startSession = async (otherUids = []) => {
    setBusy(true);
    const startTime = new Date().toISOString(); const groupUids = [user.uid, ...otherUids];
    const groupNames = groupUids.map(id => users.find(u=>u.uid===id)?.name || "Alguém").join(", ");
    const groupId = "grp_" + Date.now();
    for(const uid of groupUids) await window.fb.addDoc(window.fb.collection(window.fb.db, "sessions"), { uid, groupId, startTime, endTime: null, durationSeconds: null });
    await window.fb.addDoc(window.fb.collection(window.fb.db, "events"), { uids: groupUids, names: groupNames, type: "start", createdAt: window.fb.serverTimestamp() });
    setBusy(false);
  };

  const stopSession = async (stopForAll = false) => {
    if(!activeSession) return; setBusy(true);
    const endTime = new Date().toISOString(); const durationSeconds = Math.floor((new Date(endTime) - new Date(activeSession.startTime))/1000);
    
    if (stopForAll && activeSession.groupId) {
      const groupSessions = sessions.filter(s => s.groupId === activeSession.groupId && s.endTime === null);
      const uids = []; const namesArr = [];
      for (const s of groupSessions) {
         await window.fb.updateDoc(window.fb.doc(window.fb.db, "sessions", s.id), { endTime, durationSeconds });
         uids.push(s.uid);
         namesArr.push(users.find(u => u.uid === s.uid)?.name || "Alguém");
      }
      await window.fb.addDoc(window.fb.collection(window.fb.db, "events"), { uids, names: namesArr.join(", "), type: "stop", durationSeconds, createdAt: window.fb.serverTimestamp() });
    } else {
      await window.fb.updateDoc(window.fb.doc(window.fb.db, "sessions", activeSession.id), { endTime, durationSeconds });
      await window.fb.addDoc(window.fb.collection(window.fb.db, "events"), { uids: [user.uid], names: dbUser.name, type: "stop", durationSeconds, createdAt: window.fb.serverTimestamp() });
    }
    setBusy(false);
  };

  const addManualSession = async (startTime, endTime, durationSeconds) => {
    setBusy(true); await window.fb.addDoc(window.fb.collection(window.fb.db, "sessions"), { uid: user.uid, startTime, endTime, durationSeconds }); setBusy(false);
  };

  const deleteSession = async (id) => {
    setBusy(true); await window.fb.deleteDoc(window.fb.doc(window.fb.db, "sessions", id)); setBusy(false);
  };

  const removeUser = async (uid) => {
    await window.fb.deleteDoc(window.fb.doc(window.fb.db, "members", uid));
    if(uid === user.uid) { await handleLogout(); setDbUser(null); }
  };

  const sendChat = async (text) => {
    await window.fb.addDoc(window.fb.collection(window.fb.db, "chat"), { uid: user.uid, name: dbUser.name, photo: dbUser.photoBase64||null, text, createdAt: window.fb.serverTimestamp() });
  };

  if(!fbReady) return <div style={{flex:1, display:"flex", alignItems:"center", justifyContent:"center"}}>Carregando sistema...</div>;
  if(!user) return <LoginGoogleScreen onLogin={handleGoogleLogin} busy={loginBusy} />;
  
  // Se não tem perfil salvo OU clicou para editar, mostra a tela de configuração
  if(!dbUser || isEditingProfile) return <OnboardingScreen fbUser={user} dbUser={dbUser} onSave={saveProfile} onCancel={dbUser ? ()=>setIsEditingProfile(false) : null} busy={busy} />;

  const activeGroupCount = activeSession?.groupId ? Math.max(0, sessions.filter(s => s.groupId === activeSession.groupId && s.endTime === null).length - 1) : 0;

  return (
    <>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 20px", borderBottom:"1px solid var(--line)", background:"var(--surface-2)"}}>
        <div style={{display:"flex", alignItems:"center", gap:10, cursor:"pointer"}} onClick={()=>setIsEditingProfile(true)} title="Editar Perfil">
          <Avatar user={dbUser} />
          <div>
            <span style={{fontWeight:700, fontSize:15, display:"flex", alignItems:"center"}}>{dbUser.name} <span style={{fontSize:11, color:"var(--accent)", fontWeight:600, marginLeft:6}}>✎ ED</span></span>
            <span style={{fontSize:11, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:0.5}}>{dbUser.role}</span>
          </div>
        </div>
        <div style={{display:"flex", gap:8}}>
          <button onClick={()=>setTheme(theme==="dark"?"light":"dark")} style={{background:"none", border:"none", color:"var(--text)", cursor:"pointer", padding:8}}>{theme==="dark"?<Icons.Sun/>:<Icons.Moon/>}</button>
          <button onClick={handleLogout} style={{background:"none", border:"none", color:"var(--warn)", cursor:"pointer", padding:8, fontSize:12, fontWeight:600}}>Sair</button>
        </div>
      </div>
      {tab === "ponto" && <PontoTab user={user} users={users} sessions={sessions} activeSession={activeSession} activeGroupCount={activeGroupCount} elapsed={elapsed} onStart={startSession} onStop={stopSession} onManualAdd={addManualSession} onDeleteSession={deleteSession} busy={busy} />}
      {tab === "mural" && <MuralTab events={events} />}
      {tab === "ranking" && <RankingTab sessions={sessions} users={users} user={user} activeSession={activeSession} elapsed={elapsed} />}
      {tab === "chat" && <ChatTab user={user} chatMsgs={chatMsgs} onSend={sendChat} />}
      {tab === "membros" && <MembrosTab users={users} me={user} onRemoveUser={removeUser} />}
      <div className="bottom-nav">
        <button className={tab==="ponto"?"active":""} onClick={()=>setTab("ponto")}><Icons.Clock/> Ponto</button>
        <button className={tab==="mural"?"active":""} onClick={()=>setTab("mural")}><Icons.List/> Mural</button>
        <button className={tab==="ranking"?"active":""} onClick={()=>setTab("ranking")}><Icons.Trophy/> Ranking</button>
        <button className={tab==="chat"?"active":""} onClick={()=>setTab("chat")}><Icons.Chat/> Chat</button>
        <button className={tab==="membros"?"active":""} onClick={()=>setTab("membros")}><Icons.Users/> Equipe</button>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
