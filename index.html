<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ---------- utilidades ----------
function fmtHMS(totalSeconds){
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = String(Math.floor(s/3600)).padStart(2,"0");
  const m = String(Math.floor((s%3600)/60)).padStart(2,"0");
  const sec = String(s%60).padStart(2,"0");
  return `${h}:${m}:${sec}`;
}
function fmtHM(totalSeconds){
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  return `${h}h${String(m).padStart(2,"0")}`;
}
function startOfWeek(d){
  const x = new Date(d);
  const day = x.getDay(); // 0=domingo
  x.setHours(0,0,0,0);
  x.setDate(x.getDate() - day);
  return x;
}
function startOfMonth(d){
  const x = new Date(d.getFullYear(), d.getMonth(), 1);
  x.setHours(0,0,0,0);
  return x;
}

// ---------- onda decorativa (estado ligado/desligado) ----------
function WaveLine({active, color}){
  return (
    <svg width="100%" height="40" viewBox="0 0 300 40" preserveAspectRatio="none" style={{display:"block"}}>
      <path
        d={active ? "M0 20 Q 12 2, 24 20 T 48 20 T 72 20 T 96 20 T 120 20 T 144 20 T 168 20 T 192 20 T 216 20 T 240 20 T 264 20 T 288 20 T 312 20"
                   : "M0 20 L 300 20"}
        fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" opacity="0.9">
        {active && (
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-48 0" dur="1s" repeatCount="indefinite" />
        )}
      </path>
    </svg>
  );
}

// ---------- aba: ponto ----------

// ---------- aba: ranking ----------
function RankingTab({sessions, user, activeSession, elapsed}){
  const [period, setPeriod] = useState("semana");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");

  const range = useMemo(()=>{
    const now = new Date();
    if(period === "semana") return { start: startOfWeek(now), end: null };
    if(period === "mes") return { start: startOfMonth(now), end: null };
    if(period === "personalizado" && customStart){
      const start = new Date(customStart + "T00:00:00");
      const end = customEnd ? new Date(customEnd + "T23:59:59") : null;
      return { start, end };
    }
    return { start: startOfWeek(now), end: null };
  }, [period, customStart, customEnd]);

  const totals = useMemo(()=>{
    const map = {};
    for(const s of sessions){
      if(!s.endTime) continue;
      const st = new Date(s.startTime);
      if(st < range.start) continue;
      if(range.end && st > range.end) continue;
      map[s.uid] = map[s.uid] || { name: s.name, seconds: 0 };
      map[s.uid].seconds += s.durationSeconds || 0;
    }
    if(activeSession && user){
      const st = new Date(activeSession.startTime);
      const inRange = st >= range.start && (!range.end || st <= range.end);
      if(inRange){
        map[user.uid] = map[user.uid] || { name: user.name, seconds: 0 };
        map[user.uid].seconds += elapsed;
      }
    }
    return Object.entries(map)
      .map(([uid, v]) => ({ uid, ...v }))
      .sort((a,b) => b.seconds - a.seconds);
  }, [sessions, range, activeSession, elapsed, user]);

  const pillStyle = (key) => ({
    padding:"8px 14px", borderRadius:20, fontSize:13, border:"1px solid var(--line)",
    background: period===key ? "var(--accent)" : "var(--surface)",
    color: period===key ? "#1A1300" : "var(--text-muted)",
    fontWeight: period===key ? 600 : 500, cursor:"pointer"
  });

  return (
    <div className="fade-in" style={{flex:1, padding:"20px 20px 8px", overflowY:"auto"}}>
      <div style={{display:"flex", gap:8, marginBottom:18, flexWrap:"wrap"}}>
        <button style={pillStyle("semana")} onClick={()=>setPeriod("semana")}>Semana</button>
        <button style={pillStyle("mes")} onClick={()=>setPeriod("mes")}>Mês</button>
        <button style={pillStyle("personalizado")} onClick={()=>setPeriod("personalizado")}>Personalizado</button>
      </div>

      {period === "personalizado" && (
        <div style={{display:"flex", gap:8, marginBottom:18}}>
          <input type="date" value={customStart} onChange={e=>setCustomStart(e.target.value)}
            style={{flex:1, padding:"10px", borderRadius:10, border:"1px solid var(--line)", background:"var(--surface)", color:"var(--text)", fontSize:13}} />
          <input type="date" value={customEnd} onChange={e=>setCustomEnd(e.target.value)}
            style={{flex:1, padding:"10px", borderRadius:10, border:"1px solid var(--line)", background:"var(--surface)", color:"var(--text)", fontSize:13}} />
        </div>
      )}

      {totals.length === 0 && (
        <div style={{color:"var(--text-muted)", fontSize:14, marginTop:40, textAlign:"center"}}>
          Nenhuma hora registrada nesse período ainda.
        </div>
      )}

      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {totals.map((t, i) => (
          <div key={t.uid} style={{
            display:"flex", alignItems:"center", gap:12, background: t.uid===user?.uid ? "var(--accent-soft)" : "var(--surface)",
            border:"1px solid var(--line)", borderRadius:12, padding:"12px 14px"
          }}>
            <div className="mono" style={{width:22, textAlign:"center", color:"var(--text-muted)", fontSize:13}}>{i+1}</div>
            <div style={{flex:1, fontSize:14.5}}>{t.name}{t.uid===user?.uid ? " (você)" : ""}</div>
            <div className="mono" style={{fontSize:15, fontWeight:600}}>{fmtHM(t.seconds)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------- toast de evento ao vivo ----------
function LiveToast({event}){
  if(!event) return null;
  return (
    <div className="toast-in" style={{
      position:"absolute", top:14, left:14, right:14, zIndex:50,
      background:"var(--surface-2)", border:"1px solid var(--line)", borderRadius:12,
      padding:"12px 14px", fontSize:13.5, boxShadow:"0 8px 24px rgba(0,0,0,0.35)"
    }}>
      <strong>{event.name}</strong> {event.type === "start" ? "começou a trabalhar agora" : `parou o ponto${event.durationSeconds ? " · " + fmtHM(event.durationSeconds) : ""}`}
    </div>
  );
}

// ---------- app principal ----------
function App(){
  const [fbReady, setFbReady] = useState(!!window.fb);
  const [user, setUser] = useState(null);
  const [loginBusy, setLoginBusy] = useState(false);
  const [tab, setTab] = useState("ponto");

  const [activeSession, setActiveSession] = useState(null); // {id, startTime}
  const [elapsed, setElapsed] = useState(0);
  const [actionBusy, setActionBusy] = useState(false);

  const [rawEvents, setRawEvents] = useState([]);
  const [sessions, setSessions] = useState([]);
  const [toast, setToast] = useState(null);
  const lastEventIdRef = useRef(null);

  useEffect(()=>{
    if(window.fb){ setFbReady(true); return; }
    const h = () => setFbReady(true);
    window.addEventListener("fb-ready", h);
    return () => window.removeEventListener("fb-ready", h);
  }, []);

  // restaurar usuário salvo neste aparelho
  useEffect(()=>{
    if(!fbReady) return;
    const saved = localStorage.getItem("onda-user");
    if(saved){
      const parsed = JSON.parse(saved);
      window.fb.signInAnonymously(window.fb.auth).then(async (cred) => {
        setUser({ uid: cred.user.uid, name: parsed.name });
      });
    }
  }, [fbReady]);

  async function handleEnter(name){
    setLoginBusy(true);
    try{
      const cred = await window.fb.signInAnonymously(window.fb.auth);
      const uid = cred.user.uid;
      await window.fb.setDoc(window.fb.doc(window.fb.db, "members", uid), { name, updatedAt: new Date().toISOString() });
      localStorage.setItem("onda-user", JSON.stringify({ name }));
      setUser({ uid, name });
    } catch(e){
      alert("Não deu pra entrar agora. Confira sua internet e tente de novo.\n\n" + e.message);
    } finally {
      setLoginBusy(false);
    }
  }

  function handleLogout(){
    localStorage.removeItem("onda-user");
    localStorage.removeItem("onda-active-session");
    setUser(null);
    setActiveSession(null);
  }

  // restaurar sessão ativa (se o app foi fechado com o cronômetro rodando)
  useEffect(()=>{
    if(!user) return;
    const saved = localStorage.getItem("onda-active-session");
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed.uid === user.uid) setActiveSession(parsed);
    }
  }, [user]);

  // cronômetro
  useEffect(()=>{
    if(!activeSession){ setElapsed(0); return; }
    const tick = () => setElapsed(Math.floor((Date.now() - new Date(activeSession.startTime).getTime())/1000));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [activeSession]);

  // ouvir mural (eventos) em tempo real
  useEffect(()=>{
    if(!fbReady || !user) return;
    const q = window.fb.query(
      window.fb.collection(window.fb.db, "events"),
      window.fb.orderBy("createdAt", "desc"),
      window.fb.limit(50)
    );
    const unsub = window.fb.onSnapshot(q, (snap) => {
      const list = snap.docs.map(d => {
        const data = d.data();
        const ts = data.createdAt?.toDate ? data.createdAt.toDate() : new Date();
        return {
          id: d.id, uid: data.uid, name: data.name, type: data.type,
          durationSeconds: data.durationSeconds || 0,
          timeLabel: ts.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" })
        };
      });
      setRawEvents(list);
      if(list[0] && list[0].id !== lastEventIdRef.current){
        lastEventIdRef.current = list[0].id;
        if(list[0].uid !== user.uid){
          setToast(list[0]);
          setTimeout(()=>setToast(null), 4000);
        }
      }
    });
    return () => unsub();
  }, [fbReady, user]);

  // ouvir sessões (para ranking e totais)
  useEffect(()=>{
    if(!fbReady || !user) return;
    const q = window.fb.query(
      window.fb.collection(window.fb.db, "sessions"),
      window.fb.orderBy("startTime", "desc"),
      window.fb.limit(2000)
    );
    const unsub = window.fb.onSnapshot(q, (snap) => {
      setSessions(snap.docs.map(d => ({ id:d.id, ...d.data() })));
    });
    return () => unsub();
  }, [fbReady, user]);

  async function handleStart(){
    if(actionBusy) return;
    setActionBusy(true);
    try{
      const startTime = new Date().toISOString();
      const ref = await window.fb.addDoc(window.fb.collection(window.fb.db, "sessions"), {
        uid: user.uid, name: user.name, startTime, endTime: null, durationSeconds: null
      });
      await window.fb.addDoc(window.fb.collection(window.fb.db, "events"), {
        uid: user.uid, name: user.name, type:"start", createdAt: window.fb.serverTimestamp()
      });
      const session = { id: ref.id, uid: user.uid, startTime };
      setActiveSession(session);
      localStorage.setItem("onda-active-session", JSON.stringify(session));
    } catch(e){
      alert("Não deu pra iniciar agora. Tente de novo.\n\n" + e.message);
    } finally {
      setActionBusy(false);
    }
  }

  async function handleStop(){
    if(actionBusy || !activeSession) return;
    setActionBusy(true);
    try{
      const endTime = new Date().toISOString();
      const durationSeconds = Math.floor((new Date(endTime) - new Date(activeSession.startTime))/1000);
      await window.fb.updateDoc(window.fb.doc(window.fb.db, "sessions", activeSession.id), { endTime, durationSeconds });
      await window.fb.addDoc(window.fb.collection(window.fb.db, "events"), {
        uid: user.uid, name: user.name, type:"stop", durationSeconds, createdAt: window.fb.serverTimestamp()
      });
      setActiveSession(null);
      localStorage.removeItem("onda-active-session");
    } catch(e){
      alert("Não deu pra parar agora. Tente de novo.\n\n" + e.message);
    } finally {
      setActionBusy(false);
    }
  }

  const myTodaySeconds = useMemo(()=>{
    if(!user) return 0;
    const today = new Date(); today.setHours(0,0,0,0);
    return sessions
      .filter(s => s.uid === user.uid && s.endTime && new Date(s.startTime) >= today)
      .reduce((sum,s)=> sum + (s.durationSeconds||0), 0);
  }, [sessions, user]);

  const myTotalSeconds = useMemo(()=>{
    if(!user) return 0;
    return sessions
      .filter(s => s.uid === user.uid && s.endTime)
      .reduce((sum,s)=> sum + (s.durationSeconds||0), 0);
  }, [sessions, user]);

  if(!fbReady){
    return <div style={{flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-muted)"}}>Carregando…</div>;
  }

  if(!user){
    return <LoginScreen onEnter={handleEnter} busy={loginBusy} />;
  }

  return (
    <>
      <Header user={user} onLogout={handleLogout} />
      <LiveToast event={toast} />
      {tab === "ponto" && (
        <PontoTab
          user={user} activeSession={activeSession} elapsed={elapsed}
          onStart={handleStart} onStop={handleStop}
          myTodaySeconds={myTodaySeconds} myTotalSeconds={myTotalSeconds}
          busy={actionBusy}
        />
      )}
      {tab === "mural" && <MuralTab events={rawEvents} />}
      {tab === "ranking" && (
        <RankingTab sessions={sessions} user={user} activeSession={activeSession} elapsed={elapsed} />
      )}
      <BottomNav tab={tab} setTab={setTab} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
